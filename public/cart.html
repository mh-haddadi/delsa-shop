
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>سبد خرید | دلسا شاپ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>

  <script>
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem("theme") === "light" ? "light" : "dark";
    } catch(e) {
      document.documentElement.dataset.theme = "dark";
    }
  </script>

  <link rel="stylesheet" href="css/landing.css">
  <link rel="stylesheet" href="css/shop.css">
</head>

<body>

  <!-- هدر سایت -->
  <div class="hero relative overflow-hidden rounded-b-[2.5rem] pb-10 text-white">
    <div id="top"></div>

    <div class="mx-auto max-w-6xl px-5 pb-8 pt-10">
      <h1 class="d text-5xl md:text-6xl">سبد خرید</h1>
      <p class="mt-3 text-white/90">
        محصولات انتخاب‌شده‌ات اینجا قرار می‌گیرند.
      </p>
    </div>
  </div>

  <!-- محتوای سبد خرید -->
  <main class="mx-auto max-w-6xl px-5 py-10">

    <div id="cartContent">

      <!-- JavaScript محصولات سبد خرید را اینجا نمایش می‌دهد -->

      <div class="card rounded-3xl p-8 text-center">
        <p class="d text-3xl">سبد خرید شما</p>
        <p class="mt-3 text-[var(--muted)]">
          در حال آماده‌سازی سبد خرید...
        </p>
      </div>

    </div>

  </main>

  <!-- فوتر سایت -->
  <div id="foot-slot"></div>

  <script src="js/app.js"></script>
  <script src="js/cart.js"></script>

</body>
</html>
