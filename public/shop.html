<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فروشگاه | دلسا شاپ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")==="light"?"light":"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<link rel="stylesheet" href="css/landing.css">
<link rel="stylesheet" href="css/shop.css">
</head>
<body>
<div class="hero relative overflow-hidden rounded-b-[2.5rem] text-white">
  <div id="top"></div>
  <div class="mx-auto max-w-6xl px-5 pb-12 pt-10 md:pb-16 md:pt-14">
    <h1 class="d text-5xl md:text-6xl">فروشگاه</h1>
    <p class="mt-3 max-w-md leading-8 text-white/90">هر چه برای میز تولد و مهمانی لازم داری، یک‌جا.</p>
  </div>
</div>
<main class="mx-auto max-w-6xl px-5 py-8">
  <div class="flex flex-col gap-3 md:flex-row md:items-center">
    <input id="q" type="search" class="field md:w-80" placeholder="جستجوی محصول، مثلا فومی" aria-label="جستجوی محصول">
    <div id="chips" class="chips md:flex-1" role="group" aria-label="دسته‌بندی"></div>
    <select id="sort" class="field" aria-label="مرتب‌سازی">
      <option value="sales">جدیدترین</option><option value="cheap">ارزان‌ترین</option><option value="pricey">گران‌ترین</option>
    </select>
  </div>
  <p id="total" class="mb-4 mt-6 text-sm text-[var(--muted)]" aria-live="polite"></p>
  <div id="grid" class="grid grid-cols-2 gap-3 md:grid-cols-4 md:gap-5"><div class="skel"></div><div class="skel"></div><div class="skel hidden md:block"></div><div class="skel hidden md:block"></div></div>
  <div id="empty" hidden class="py-16 text-center"><p class="d text-3xl">چیزی پیدا نشد</p><p class="mt-2 text-[var(--muted)]">عبارت دیگری را جستجو کن یا فیلترها را بردار.</p><button id="reset" class="btn sun mt-6">پاک کردن فیلترها</button></div>
</main>
<div id="foot-slot"></div>
<script src="js/app.js"></script>
<script src="js/shop.js"></script>
</body>
</html>
